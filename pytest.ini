[pytest]
# Scopes bare `pytest` / `python -m pytest` (run from the repo root) to this
# repo's own test suite only. moniger_copilot_tests/ ships its own
# pytest.ini (marker registration for its guardrail/arithmetic/budget/tax/pii
# groups) and is meant to be run standalone from inside that directory (see
# its README) -- without this, pytest's default rootdir-upward collection
# would also sweep up moniger_copilot_tests/test_copilot.py, which reads
# "ground_truth.json" relative to its own directory and fails to collect at
# all when the working directory is the repo root instead.
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
